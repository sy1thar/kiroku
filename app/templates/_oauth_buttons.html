<div style="margin-top:20px; padding-top:18px; border-top:1px solid var(--border);">
  <div style="font-size:0.84rem; color:var(--muted); text-align:center; margin-bottom:12px;">
    {{ "Или продолжить через сервис" if locale == "ru" else "Or continue with" }}
  </div>

  {% if oauth_notice %}
  <div style="background:rgba(124,107,255,0.12); border:1px solid rgba(124,107,255,0.35); border-radius:10px; padding:10px 12px; font-size:0.84rem; color:#d6deed; margin-bottom:12px;">
    {{ oauth_notice }}
  </div>
  {% endif %}

  <div class="oauth-grid">
    <a class="oauth-btn" href="/auth/oauth/google">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.3 14.7 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12S6.7 21.6 12 21.6c6.9 0 9.1-4.8 9.1-7.3 0-.5-.1-.9-.1-1.3H12z"/></svg>
      <span>Google</span>
    </a>
    <a class="oauth-btn" href="/auth/oauth/apple">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.8 0-1.9-.9-3.1-.8-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.1 1.7 2.4 3 2.4 1.2-.1 1.7-.8 3.1-.8 1.4 0 1.9.8 3.1.8 1.3 0 2.1-1.1 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.7-1-2.7-4.1zm-2.3-7c.7-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1.1.1 2.2-.5 2.8-1.3z"/></svg>
      <span>Apple</span>
    </a>
    <a class="oauth-btn" href="/auth/oauth/discord">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2" aria-hidden="true"><path d="M20.3 4.4A16.5 16.5 0 0 0 16.2 3l-.2.4a15.3 15.3 0 0 1 3.7 1.8c-1.6-.8-3.3-1.3-5-1.6a14 14 0 0 0-5.4 0c-1.7.3-3.4.8-5 1.6A15.3 15.3 0 0 1 8 3.4L7.8 3a16.5 16.5 0 0 0-4.1 1.4C1.2 8.2.5 12 .8 15.7a16.6 16.6 0 0 0 5 2.5l1-1.6a10.7 10.7 0 0 1-1.6-.8l.4-.3a11.7 11.7 0 0 0 12.8 0l.4.3a10.7 10.7 0 0 1-1.6.8l1 1.6a16.6 16.6 0 0 0 5-2.5c.4-4.3-.6-8.1-2.9-11.3zM8.7 13.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
      <span>Discord</span>
    </a>
    <a class="oauth-btn" href="/auth/oauth/telegram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#29B6F6" aria-hidden="true"><path d="M9.8 15.2l-.4 5.2c.6 0 .8-.3 1.1-.6l2.6-2.5 5.4 4c1 .5 1.7.3 1.9-.9l3.5-16.4c.3-1.4-.5-2-1.5-1.6L1.9 10.3c-1.4.5-1.4 1.3-.2 1.7l5.2 1.6L19 6c.6-.4 1.1-.2.7.2z"/></svg>
      <span>Telegram</span>
    </a>
    <a class="oauth-btn" href="/auth/oauth/github" style="grid-column: 1 / -1;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2.1c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 5 18.3 5.3 18.3 5.3c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      <span>GitHub</span>
    </a>
  </div>

  {% if telegram_bot_username %}
  <div style="margin-top:14px; display:flex; justify-content:center;">
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ telegram_bot_username }}"
      data-size="large"
      data-auth-url="/auth/telegram/callback"
      data-request-access="write"></script>
  </div>
  {% endif %}
</div>
