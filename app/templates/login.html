{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:460px; margin:24px auto;">
  <h1 style="margin-top:0;">{{ ui.nav_login }}</h1>
  <form id="login-form" style="display:grid; gap:14px;">
    <div class="field-group">
      <label>{{ "Логин или Email" if locale == "ru" else "Username or Email" }}</label>
      <input type="text" name="login" required />
    </div>
    <div class="field-group">
      <label>{{ "Пароль" if locale == "ru" else "Password" }}</label>
      <input type="password" name="password" required minlength="6" />
    </div>
    <div id="auth-error" style="color:#fda4af; font-size:0.88rem; display:none;"></div>
    <button class="btn btn-primary" type="submit">{{ ui.nav_login }}</button>
  </form>
  <p style="margin-top:16px; color:var(--muted); font-size:0.9rem;">
    {{ "Нет аккаунта?" if locale == "ru" else "No account yet?" }}
    <a href="/{{ locale }}/register" style="color:var(--sky);">{{ ui.nav_register }}</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  const fd = new FormData(e.target);
  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ login: fd.get("login"), password: fd.get("password") }),
  });
  const data = await res.json();
  if (!res.ok) {
    errEl.textContent = data.detail || "Login failed";
    errEl.style.display = "block";
    return;
  }
  window.location.href = "/{{ locale }}/lists";
});
</script>
{% endblock %}
