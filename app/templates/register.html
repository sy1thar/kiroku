{% extends "base.html" %}
{% block content %}
<div class="panel" style="max-width:460px; margin:24px auto;">
  <h1 style="margin-top:0;">{{ ui.nav_register }}</h1>
  <form id="register-form" style="display:grid; gap:14px;">
    <div class="field-group">
      <label>{{ "Никнейм (латиница/цифры)" if locale == "ru" else "Username" }}</label>
      <input type="text" name="username" required minlength="3" pattern="[a-zA-Z0-9_.-]+" />
    </div>
    <div class="field-group">
      <label>Email</label>
      <input type="email" name="email" required />
    </div>
    <div class="field-group">
      <label>{{ "Пароль (от 6 символов)" if locale == "ru" else "Password (min 6 chars)" }}</label>
      <input type="password" name="password" required minlength="6" />
    </div>
    <div id="auth-error" style="color:#fda4af; font-size:0.88rem; display:none;"></div>
    <button class="btn btn-primary" type="submit">{{ ui.nav_register }}</button>
  </form>
  <p style="margin-top:16px; color:var(--muted); font-size:0.9rem;">
    {{ "Уже есть аккаунт?" if locale == "ru" else "Already registered?" }}
    <a href="/{{ locale }}/login" style="color:var(--sky);">{{ ui.nav_login }}</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  const fd = new FormData(e.target);
  const res = await fetch("/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: fd.get("username"),
      email: fd.get("email"),
      password: fd.get("password"),
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    errEl.textContent = data.detail || "Registration failed";
    errEl.style.display = "block";
    return;
  }
  window.location.href = "/{{ locale }}/lists";
});
</script>
{% endblock %}
