[project]
name = "kiroku"
version = "0.1.0"
description = "Kiroku — Global Cross-Media & Character Encyclopedia (Anime, Manga, Manhwa, Games, Visual Novels)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
search = ["meilisearch>=0.31.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
