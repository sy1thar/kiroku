services:
  - type: web
    name: kiroku
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: ru
      - key: SUPPORTED_LOCALES
        value: ru,en
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kiroku-db
          property: connectionString

databases:
  - name: kiroku-db
    plan: free
